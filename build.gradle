plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework:spring-context:6.2.5'
    implementation 'org.springframework:spring-jdbc:6.1.12'
    implementation 'org.postgresql:postgresql:42.7.4'

    //Spring Data JPA
    implementation 'org.springframework.data:spring-data-jpa:3.4.3'
    //Hibernate
    implementation 'org.hibernate.orm:hibernate-core:6.6.11.Final'


    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Mockito
    testImplementation 'org.mockito:mockito-core:5.16.1'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.16.1'

    // AssertJ
    testImplementation 'org.assertj:assertj-core:3.27.3'

    // Testcontainers
    testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
    testImplementation 'org.testcontainers:postgresql:1.21.3'

    // SLF4J
    testRuntimeOnly 'org.slf4j:slf4j-simple:1.7.36'
}

test {
    useJUnitPlatform()
}